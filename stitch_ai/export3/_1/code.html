<!DOCTYPE html>

<html class="h-full" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>新建孩子档案</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "display": ["23px", { "lineHeight": "1.3", "fontWeight": "600" }]

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bg text-on-surface font-body text-body antialiased min-h-full flex flex-col justify-between selection:bg-secondary-container">
<!-- 页面容器 (限制小程序移动端视口宽度，兼顾居中展示) -->
<div class="w-full max-w-md mx-auto flex flex-col min-h-screen bg-bg relative pb-10">
<!-- 微信小程序顶栏 (TopAppBar 规范落实) -->
<header class="sticky top-0 z-40 bg-surface border-b border-line">
<!-- 胶囊占位高度与导航区 -->
<div class="flex justify-between items-center w-full px-4 h-12">
<button aria-label="返回" class="w-8 h-8 flex items-center justify-center text-primary rounded hover:bg-surface-variant active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="chevron_left">chevron_left</span>
</button>
<div class="text-center">
<h1 class="font-title text-title text-ink-1 tracking-tight">新建孩子档案</h1>
</div>
<div class="flex items-center space-x-1 border border-line rounded-full px-2 py-0.5 bg-surface-bright">
<span class="material-symbols-outlined text-[16px] text-ink-2" data-icon="more_horiz">more_horiz</span>
<span class="w-[1px] h-3 bg-line"></span>
<span class="inline-block w-2.5 h-2.5 rounded-full border border-ink-2"></span>
</div>
</div>
<!-- 页面副标题引导栏 -->
<div class="px-4 py-2 bg-accent-soft/50 border-t border-line/40 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] text-accent flex-shrink-0" data-icon="info">info</span>
<p class="font-caption text-caption text-ink-2 leading-tight">信息用于生成贴合月龄的养育参考</p>
</div>
</header>
<!-- 主表单主体卡片容器 -->
<main class="flex-1 px-4 py-4 space-y-4">
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- 卡片一：必填项区域 -->
<section class="bg-surface rounded-xl border border-line p-4 space-y-4 shadow-none">
<div class="flex items-center justify-between pb-2 border-b border-line/60">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-4 bg-accent rounded-full"></span>
<h2 class="font-title text-title text-ink-1 text-[17px]">基础信息</h2>
</div>
<span class="font-caption text-caption text-warn bg-warn-soft px-2 py-0.5 rounded text-[11px] font-medium">带 * 为必填项</span>
</div>
<!-- 昵称 -->
<div class="space-y-1.5">
<label class="block font-sub text-sub font-medium text-ink-1">
              昵称 <span class="text-danger">*</span>
</label>
<div class="relative">
<input class="w-full h-[44px] px-3.5 bg-surface border border-line rounded-xl text-ink-1 font-body text-body focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors" placeholder="请输入宝宝昵称" type="text" value="宝宝 A"/>
</div>
</div>
<!-- 出生日期 -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-sub text-sub font-medium text-ink-1">
                出生日期 <span class="text-danger">*</span>
</label>
<div class="flex items-center gap-1 text-ink-3">
<span class="material-symbols-outlined text-[14px]" data-icon="visibility">visibility</span>
<span class="font-caption text-caption text-[11px]">已开启私密校对</span>
</div>
</div>
<div class="relative flex items-center">
<input class="w-full h-[44px] px-3.5 pr-10 bg-surface border border-line rounded-xl text-ink-1 font-numeric text-numeric focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors" type="date" value="2024-07-12"/>
<span class="material-symbols-outlined absolute right-3 text-ink-3 pointer-events-none text-[20px]" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- 性别 -->
<div class="space-y-1.5">
<label class="block font-sub text-sub font-medium text-ink-1">
              性别 <span class="text-danger">*</span>
</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center justify-center gap-2 h-[44px] border border-line rounded-xl bg-surface cursor-pointer hover:bg-surface-2 transition-all">
<input class="text-accent focus:ring-accent w-4 h-4 text-accent border-line" name="gender" type="radio" value="male"/>
<span class="font-sub text-sub text-ink-2">男</span>
</label>
<label class="flex items-center justify-center gap-2 h-[44px] border border-accent bg-accent-soft/30 rounded-xl cursor-pointer transition-all">
<input checked="" class="text-accent focus:ring-accent w-4 h-4 border-line" name="gender" type="radio" value="female"/>
<span class="font-sub text-sub text-accent font-medium">女</span>
</label>
</div>
</div>
</section>
<!-- 卡片二：生长情况（选填，越全越贴合） -->
<section class="bg-surface rounded-xl border border-line p-4 space-y-4 shadow-none">
<div class="flex items-center justify-between pb-2 border-b border-line/60">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-4 bg-line-strong rounded-full"></span>
<h2 class="font-title text-title text-ink-1 text-[17px]">生长情况</h2>
</div>
<span class="font-caption text-caption text-ink-3">选填 · 越全越贴合</span>
</div>
<!-- 身高与体重并排网格 -->
<div class="grid grid-cols-2 gap-3">
<div class="space-y-1.5">
<label class="block font-sub text-sub text-ink-2">身高 (cm)</label>
<div class="relative flex items-center">
<input class="w-full h-[44px] px-3.5 pr-9 bg-surface border border-line rounded-xl text-ink-1 font-numeric text-numeric focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" placeholder="0.0" step="0.1" type="number" value="92"/>
<span class="absolute right-3 font-caption text-caption text-ink-3 pointer-events-none">cm</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block font-sub text-sub text-ink-2">体重 (kg)</label>
<div class="relative flex items-center">
<input class="w-full h-[44px] px-3.5 pr-8 bg-surface border border-line rounded-xl text-ink-1 font-numeric text-numeric focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent" placeholder="0.0" step="0.1" type="number" value="13.0"/>
<span class="absolute right-3 font-caption text-caption text-ink-3 pointer-events-none">kg</span>
</div>
</div>
</div>
<!-- 是否早产下拉 -->
<div class="space-y-1.5">
<label class="block font-sub text-sub text-ink-2">是否早产</label>
<div class="relative">
<select class="w-full h-[44px] px-3.5 bg-surface border border-line rounded-xl text-ink-1 font-body text-body appearance-none focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent">
<option selected="" value="false">否</option>
<option value="true">是</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-ink-3 pointer-events-none text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- 已知过敏项 -->
<div class="space-y-1.5">
<label class="block font-sub text-sub text-ink-2">已知过敏项</label>
<div class="flex flex-wrap items-center gap-2 p-2 min-h-[44px] border border-line rounded-xl bg-surface">
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-surface-2 text-ink-2 font-caption text-caption border border-line-strong/60">
<span>无</span>
<button class="text-ink-3 hover:text-danger flex items-center" type="button">
<span class="material-symbols-outlined text-[13px]" data-icon="close">close</span>
</button>
</span>
<button class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded text-accent hover:bg-accent-soft font-caption text-caption transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="add">add</span>
<span>添加</span>
</button>
</div>
</div>
<!-- 辅食开始月龄 -->
<div class="space-y-1.5">
<label class="block font-sub text-sub text-ink-2">辅食开始月龄</label>
<div class="relative">
<select class="w-full h-[44px] px-3.5 bg-surface border border-line rounded-xl text-ink-1 font-body text-body appearance-none focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent">
<option value="4">4 月龄</option>
<option value="5">5 月龄</option>
<option selected="" value="6">6 月龄</option>
<option value="7">7 月龄</option>
<option value="8">8 月龄及以上</option>
<option value="none">尚未添加</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-ink-3 pointer-events-none text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
<!-- 卡片三：只读服务端派生条 (GraduatedBand 刻度槽指示器) -->
<section class="bg-surface rounded-xl border border-line p-4 space-y-3 shadow-none">
<div class="flex items-center justify-between">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] text-accent" data-icon="straighten">straighten</span>
<span class="font-sub text-sub font-medium text-ink-1">自动计算：月龄 24 月 · 区间 1-3 岁</span>
</div>
<span class="font-caption text-caption text-ink-3 bg-surface-2 px-1.5 py-0.5 rounded border border-line/60">只读，服务端派生</span>
</div>
<!-- 刻度量具槽 -->
<div class="pt-2 pb-1 space-y-1.5">
<div class="relative w-full h-3 bg-surface-2 rounded-full overflow-hidden flex border border-line">
<!-- 区间1: 0-1岁 -->
<div class="w-1/4 h-full bg-line/60 border-r border-surface"></div>
<!-- 区间2: 1-3岁 (激活带) -->
<div class="w-2/4 h-full bg-accent-soft relative border-r border-surface">
<!-- 游标定位点 (24月刚好在1-3岁中点) -->
<div class="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-2.5 bg-accent rounded-full border border-surface shadow-sm"></div>
</div>
<!-- 区间3: 3岁以上 -->
<div class="w-1/4 h-full bg-line/60"></div>
</div>
<!-- 标尺刻度文字 -->
<div class="flex justify-between font-caption text-caption text-ink-3 text-[11px] px-0.5">
<span>0 岁</span>
<span>1 岁</span>
<span class="text-accent font-medium">当前 (24月)</span>
<span>3 岁</span>
<span>6 岁+</span>
</div>
</div>
<p class="font-caption text-caption text-ink-3 leading-relaxed">
            系统已依据出生日期锁定阶段生长常模，自动匹配适合的发展监测与营养辅导区间。
          </p>
</section>
<!-- 动作触发与加密提示 -->
<div class="pt-2 space-y-3">
<!-- 墨青色 #0A6B60 主按钮 -->
<button class="w-full h-[44px] bg-[#0A6B60] hover:bg-[#074E46] active:bg-[#074E46] text-white font-title text-body rounded-xl font-medium tracking-wide flex items-center justify-center transition-all shadow-none" type="submit">
            保存
          </button>
<div class="flex items-center justify-center gap-1.5 text-ink-3 font-caption text-caption">
<span class="material-symbols-outlined text-[14px] text-accent" data-icon="lock">lock</span>
<span>敏感字段加密存储</span>
</div>
</div>
</form>
</main>
<!-- 底部常驻合规提示 -->
<footer class="mt-6 px-4 py-3 text-center border-t border-line/60 bg-surface/50">
<div class="inline-flex items-center justify-center gap-1 text-ink-3 font-caption text-caption">
<span class="material-symbols-outlined text-[13px]" data-icon="verified_user">verified_user</span>
<span>AI 生成内容，仅供参考，不替代医生诊断</span>
</div>
</footer>
</div>
</body></html>
