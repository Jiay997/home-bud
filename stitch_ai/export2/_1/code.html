<script>
    // 选项切换微交互：支持纯点击即时视觉联动与单选状态同步
    document.querySelectorAll('input[name="assessment_opt"]').forEach(input => {
      input.addEventListener('change', () => {
        document.querySelectorAll('input[name="assessment_opt"]').forEach(otherInput => {
          const card = otherInput.closest('label').querySelector('div');
          const badge = card.querySelector('span:first-child');
          const radioCircle = card.querySelector('div:last-child');
          const textSpan = card.querySelector('span:last-of-type');

          if (otherInput.checked) {
            card.className = "w-full p-3.5 bg-surface border-2 border-accent rounded-xl flex items-center justify-between transition-all bg-accent-soft/20 shadow-none";
            badge.className = "w-6 h-6 rounded-lg bg-accent text-on-accent font-numeric text-caption flex items-center justify-center font-medium shrink-0";
            textSpan.className = "font-body text-sub text-ink-1 font-semibold leading-snug";
            radioCircle.className = "w-5 h-5 rounded-full border-2 border-accent flex items-center justify-center shrink-0 bg-surface";
            radioCircle.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-accent"></div>';
          } else {
            card.className = "w-full p-3.5 bg-surface border border-line rounded-xl flex items-center justify-between transition-all hover:bg-surface-2 active:bg-surface-container shadow-none";
            badge.className = "w-6 h-6 rounded-lg bg-surface-2 text-ink-2 font-numeric text-caption flex items-center justify-center font-medium shrink-0 border border-line";
            textSpan.className = "font-body text-sub text-ink-2 leading-snug";
            radioCircle.className = "w-5 h-5 rounded-full border border-line-strong flex items-center justify-center shrink-0 bg-surface";
            radioCircle.innerHTML = '';
          }
        });
      });
    });
  </script>
