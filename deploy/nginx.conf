# =============================================================================
# Babe宝伴 nginx 配置
#
# 职责：
#   1. 托管两个静态站点：
#      /app/   → uni-app 跨端工程 client/ 的 H5 产物（与微信小程序同一套源码）
#      /admin/ → 后台管理端 admin-web/ 产物（Element Plus，Web-only）
#   2. /api/ 反向代理到 backend:8000
#   3. SSE 流式接口（/api/v1/qa/sessions/*/stream）关闭一切缓冲，
#      保证 AI 问答逐字推送不被 nginx 攒包
#   4. /media/ 档案头像/相册静态文件反代到 backend（^~ 优先于静态资源正则）
#
# 上游服务名 backend 来自 docker-compose 服务名（容器网络内 DNS）
# =============================================================================

# --- 上游后端 ---
upstream jiaban_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- 反馈图片上传：允许最大 10MB 请求体 ---
    client_max_body_size 10m;

    # 浏览器默认请求根 favicon：显式返回 204，避免落到前端目录产生 404 噪声
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # 通用压缩（SSE 路径内单独关闭，见下方 location）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ---------- SSE 流式接口（AI 问答逐字推送，必须无缓冲） ----------
    # 正则 location 优先级高于普通前缀 location /api/，关闭缓冲配置不会被覆盖。
    location ~ ^/api/v1/qa/sessions/.*/stream$ {
        proxy_pass http://jiaban_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 关闭代理缓冲：后端数据立即转发客户端，不攒包
        proxy_buffering off;
        # 关闭 gzip：压缩会攒满一块数据才发出，破坏流式实时性
        gzip off;
        # 禁用该响应缓存
        proxy_cache off;
        # 通知上游/中间层同样关闭缓冲
        add_header X-Accel-Buffering no;
        # 启用 chunked 分块传输
        chunked_transfer_encoding on;
        # SSE 空闲等待下个 token 时间较长，读超时放宽到 120s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- 档案媒体静态文件（头像/相册） ----------
    # 注意：必须 ^~ 前缀，否则被下方静态资源正则 location（jpg/png…）
    # 按「正则优先」截获而落到前端目录 404；/media/ 由后端 StaticFiles 提供
    location ^~ /media/ {
        proxy_pass http://jiaban_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 通用 API 反向代理 ----------
    location /api/ {
        proxy_pass http://jiaban_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 根路径：引导到 C 端 H5 ----------
    location = / {
        return 302 /app/;
    }

    # ---------- C 端 H5（uni-app 产物，history 路由回退） ----------
    # index.html 必须不缓存：它引用带 hash 的 chunk，若被浏览器缓存，
    # 重新发布后旧 index.html 会指向已删除的旧 chunk → 页面打不开
    # （uni-app 会显示「连接服务器超时，点击屏幕重试」，实测踩坑）。
    location /app/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    # ---------- 后台管理端（history 路由回退） ----------
    location /admin/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 静态资源缓存（vite/uni 产物带 hash，可长缓存）
    # 注意：必须负向先行排除 /api/ 与 /media/，否则 .png/.ico 结尾的 API 端点
    # （如分享长图 /api/v1/share/**/share-card.png）会被本正则按「正则优先」
    # 截获到前端静态目录，返回 nginx HTML 404（实测踩坑：N7/D-01）
    location ~* ^/(?!api/)(?!media/).*\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
