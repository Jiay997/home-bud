# =============================================================================
# 小光景 nginx 配置
#
# 职责：
#   1. 托管前端静态文件，/app/* 与 /admin/* 均回退到 index.html（history 路由）
#   2. /api/ 反向代理到 backend:8000
#   3. SSE 流式接口（/api/v1/qa/sessions/*/stream）关闭一切缓冲，
#      保证 AI 问答逐字推送不被 nginx 攒包
#   4. /media/ 档案头像/相册静态文件反代到 backend（^~ 优先于静态资源正则）
#
# 上游服务名 backend 来自 docker-compose 服务名（容器网络内 DNS）
# =============================================================================

# --- 上游后端 ---
upstream jiaban_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- 反馈图片上传：允许最大 10MB 请求体 ---
    client_max_body_size 10m;

    # 通用压缩（SSE 路径内单独关闭，见下方 location）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ---------- SSE 流式接口（AI 问答逐字推送，必须无缓冲） ----------
    # 正则 location 优先级高于普通前缀 location /api/，关闭缓冲配置不会被覆盖。
    location ~ ^/api/v1/qa/sessions/.*/stream$ {
        proxy_pass http://jiaban_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 关闭代理缓冲：后端数据立即转发客户端，不攒包
        proxy_buffering off;
        # 关闭 gzip：压缩会攒满一块数据才发出，破坏流式实时性
        gzip off;
        # 禁用该响应缓存
        proxy_cache off;
        # 通知上游/中间层同样关闭缓冲
        add_header X-Accel-Buffering no;
        # 启用 chunked 分块传输
        chunked_transfer_encoding on;
        # SSE 空闲等待下个 token 时间较长，读超时放宽到 120s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- 档案媒体静态文件（头像/相册） ----------
    # 注意：必须 ^~ 前缀，否则被下方静态资源正则 location（jpg/png…）
    # 按「正则优先」截获而落到前端目录 404；/media/ 由后端 StaticFiles 提供
    location ^~ /media/ {
        proxy_pass http://jiaban_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 通用 API 反向代理 ----------
    location /api/ {
        proxy_pass http://jiaban_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 前端 history 路由回退 ----------
    location /app/ {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（vite 产物带 hash，可长缓存）
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}