# =====================================================================
# Babe宝伴 HomeBud - CI 流水线（.github/workflows/ci.yml）
# 口径与 scripts/ci_gate.ps1 一致：
#   契约校验(contract_check) → 拟人化文案扫描(copy_compliance_check)
#   → 渠道号码扫描(check_hardcoded_phones) → 后端测试(pytest)
#   → C 端 H5 构建(client) → 后台构建(admin-web)
#   任一环节失败即中止，GitHub Actions 以退出码 1 标红。
# 数据库：服务容器 postgres:16 与 tests/conftest.py 无 backend/.env 时的
#   默认连接串 postgres:postgres@localhost:5432/jiaban 对齐
#   （pytest 使用独立测试库 jiaban_test，由 conftest.py 自行创建）。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: 后端测试 + 契约校验 + 合规扫描 + 前端构建
    # 注：GitHub Actions 的 services 服务容器仅支持 Linux runner，
    # 故 CI 使用 ubuntu-latest（本地 Windows 门禁仍走 scripts/ci_gate.ps1）
    runs-on: ubuntu-latest

    # PostgreSQL 16 服务容器（pytest 需要 DB 可达）
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jiaban
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LLM_MOCK: "true"  # 模拟 LLM 模式：加速且结果确定

    steps:
      # ---------- 1. 检出代码 ----------
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 2. 安装 Python 3.12 ----------
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------- 3. 安装后端依赖 ----------
      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      # ---------- 4. 契约校验（前端调用 × OpenAPI + 文档完整性门禁） ----------
      - name: 契约校验（contract_check）
        working-directory: backend
        run: python scripts/contract_check.py

      # ---------- 5. 拟人化文案扫描（RQ-02 / NFR-C14，fail-closed） ----------
      - name: 拟人化文案扫描（copy_compliance_check）
        working-directory: backend
        run: python scripts/copy_compliance_check.py

      # ---------- 6. 渠道硬编码号码扫描（RQ-03 / DR-26） ----------
      - name: 渠道号码扫描（check_hardcoded_phones）
        working-directory: backend
        run: python scripts/check_hardcoded_phones.py

      # ---------- 7. 后端测试（独立测试库 jiaban_test） ----------
      - name: 后端测试（pytest）
        working-directory: backend
        run: python -m pytest tests -q

      # ---------- 8. 安装 Node 20 ----------
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- 9. 安装 C 端依赖并构建 H5 ----------
      - name: 安装 C 端依赖
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: C 端 H5 构建
        working-directory: client
        run: npm run build:h5

      # ---------- 10. 安装后台依赖并构建 ----------
      - name: 安装后台依赖
        working-directory: admin-web
        run: npm ci --no-audit --no-fund

      - name: 后台管理端构建
        working-directory: admin-web
        run: npm run build
